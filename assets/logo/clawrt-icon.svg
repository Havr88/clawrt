<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="clawrtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6F00" />
      <stop offset="33%" stop-color="#C173FF" />
      <stop offset="66%" stop-color="#3AB5ED" />
      <stop offset="100%" stop-color="#00C7E2" />
    </linearGradient>
  </defs>

  <!-- Hexagonal C-Circuit Outer Frame -->
  <polygon points="50,8 85,28 85,72 50,92 15,72 15,28" 
