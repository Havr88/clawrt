  <!-- Inner Intersecting Circuit Data Flow Lines (Hexagonal C Shape) -->
  <path d="M 70 34 L 50 22 L 30 34 L 30 66 L 50 78 L 70 66" 
        fill="none" 
        stroke="url(#clawrtGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
