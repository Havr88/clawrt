  <!-- Internal Cross Circuit Traces -->
  <path d="M 30 34 L 50 46 L 70 34 M 30 66 L 50 54 L 70 66 M 50 46 L 50 54" 
        fill="none" 
        stroke="url(#clawrtGrad)" 
        stroke-width="4" 
