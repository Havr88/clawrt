name: ClawRT CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build & Test Multi-Arch
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run Unit Tests
        run: |
          go test -v ./...

      - name: Verify Go Formatting & Vet
        run: |
          go vet ./...

      - name: Build Multi-Arch Binaries
        run: |
          bash scripts/build.sh

      - name: Build OPKG Packages
        run: |
          bash scripts/make-package.sh
